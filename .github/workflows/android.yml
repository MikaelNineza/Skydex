name: Android

on:
  push:
    branches: [main]
  pull_request:
    paths: ["app/**", "shared/**", "gradle/**", "*.gradle.kts"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :shared:test :app:testDebugUnitTest :app:assembleDebug

name: Server

on:
  push:
    branches: [main]
  pull_request:
    paths: ["server/**", "shared/**", "gradle/**", "*.gradle.kts"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKYDEX_SKIP_APP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :shared:test :server:test :server:buildFatJar
      # Add a deploy step here once a host (Railway / Fly.io / Render) is chosen.

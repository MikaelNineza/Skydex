ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.skydex.server.ApplicationKt.module ]
    }
}

# Secrets come from environment variables. Never commit real values.
hypixel {
    apiKey = ""
    apiKey = ${?HYPIXEL_API_KEY}
}

database {
    url = "jdbc:postgresql://localhost:5432/skydex"
    url = ${?DATABASE_URL}
    # Dev defaults match docker-compose.yml.
    user = "skydex"
    user = ${?DATABASE_USER}
    password = "skydex"
    password = ${?DATABASE_PASSWORD}
    # false runs the server without Postgres: no device registration or push alerts.
    enabled = true
    enabled = ${?DATABASE_ENABLED}
}

firebase {
    # Path to the service account JSON. Empty means pushes are only logged.
    credentialsPath = ""
    credentialsPath = ${?FIREBASE_CREDENTIALS}
}

# The app's update check reads the latest GitHub release of this repo. Empty turns GET /v1/app/latest off.
# The app itself only installs releases from MikaelNineza/Skydex: a fork must also change RELEASE_REPO in the app's
# UpdateDownloader.
github {
    repo = "MikaelNineza/Skydex"
    repo = ${?GITHUB_REPO}
    # Optional. Raises GitHub's limit from 60 to 5000 requests/hour (shared hosts share the unauthenticated limit).
    # A fine-grained token with no permissions is enough for a public repo. (Not GITHUB_TOKEN, which GitHub Actions sets.)
    token = ""
    token = ${?SKYDEX_GITHUB_TOKEN}
}

jobs {
    alertIntervalSeconds = 60
}

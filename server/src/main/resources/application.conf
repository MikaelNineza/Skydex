ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.skydex.server.ApplicationKt.module ]
    }
}

# Secrets come from environment variables. Never commit real values.
hypixel {
    apiKey = ""
    apiKey = ${?HYPIXEL_API_KEY}
}

database {
    url = "jdbc:postgresql://localhost:5432/skydex"
    url = ${?DATABASE_URL}
    # Dev defaults match docker-compose.yml.
    user = "skydex"
    user = ${?DATABASE_USER}
    password = "skydex"
    password = ${?DATABASE_PASSWORD}
    # false runs the server without Postgres: no device registration or push alerts.
    enabled = true
    enabled = ${?DATABASE_ENABLED}
}

firebase {
    # Path to the service account JSON. Empty means pushes are only logged.
    credentialsPath = ""
    credentialsPath = ${?FIREBASE_CREDENTIALS}
}

jobs {
    alertIntervalSeconds = 60
}
